# cargo-deny policy for AlphaWinnow.
#
# The product boundary in AGENTS.md is "local-only": no credentials, no
# telemetry, no broker, exchange, or remote research-platform integration.
# The `bans` section below turns that promise into a mechanical check so a
# transitive dependency cannot quietly add an HTTP or TLS stack.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# Nothing in the runtime graph may open a socket or speak TLS.
deny = [
    { name = "curl" },
    { name = "curl-sys" },
    { name = "hyper" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "reqwest" },
    { name = "rustls" },
    { name = "tonic" },
    { name = "ureq" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
