# cargo-deny policy for AlphaWinnow.
#
# The product boundary in AGENTS.md is "local-only": no credentials, no
# telemetry, no broker, exchange, or remote research-platform integration.
# The `bans` section below turns that promise into a mechanical check so a
# transitive dependency cannot quietly add an HTTP or TLS stack.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Temporary maintenance-risk exception. See docs/dependency-exceptions.md.
# Review by 2026-12-31; this deadline is manual, not enforced by cargo-deny 0.20.2.
# This does not suppress any other Chrono advisory or disable vulnerability checks.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "Chrono is required by Arrow/Parquet 60.2 and our optional Parquet reader; no patched version exists. Review by 2026-12-31 and remove after migration. See docs/dependency-exceptions.md." },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# Nothing in the runtime graph may open a socket or speak TLS.
deny = [
    { name = "curl" },
    { name = "curl-sys" },
    { name = "hyper" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "reqwest" },
    { name = "rustls" },
    { name = "tonic" },
    { name = "ureq" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
