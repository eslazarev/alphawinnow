version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      arrow-parquet:
        patterns:
          - arrow-*
          - parquet
      rust-dependencies:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /tools/radiate-selection-benchmark
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
