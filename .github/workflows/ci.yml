name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Test default features
        run: cargo test --workspace --locked

      - name: Test all features
        run: cargo test --workspace --locked --all-features

  features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library only
            flags: "--no-default-features"
          - name: library + numeric-evidence
            flags: "--no-default-features --features numeric-evidence"
          - name: library + parquet-input
            flags: "--no-default-features --features parquet-input"
          - name: cli + numeric-evidence
            flags: "--features numeric-evidence"
          - name: cli + parquet-input
            flags: "--features parquet-input"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and test ${{ matrix.flags }}
        run: cargo test --workspace --locked ${{ matrix.flags }}

  library-graph:
    name: Library dependency guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The `cli` feature exists so that library consumers who depend on this
      # crate with `default-features = false` never compile an argument parser.
      # Assert that, rather than trusting the manifest to stay correct.
      - name: No CLI-only crate may reach the library graph
        run: |
          set -euo pipefail
          graph="$(cargo tree --no-default-features --target all --edges normal --prefix none)"
          echo "${graph}"
          for forbidden in clap anyhow; do
            if grep -qE "^${forbidden} v" <<< "${graph}"; then
              echo "::error title=Library graph regression::${forbidden} is reachable without the cli feature"
              exit 1
            fi
          done

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check against the declared rust-version
        run: cargo check --workspace --all-targets --all-features --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  package:
    name: Package (publish dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify the crate is publishable
        run: cargo publish --workspace --dry-run --locked

  benchmark-tool:
    name: Radiate benchmark tool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/radiate-selection-benchmark

      - name: Check the standalone comparison workspace
        run: cargo check --locked --manifest-path tools/radiate-selection-benchmark/Cargo.toml
