name: Release

on:
  push:
    # Landing on main raises the version and releases it. Pushing a tag by hand
    # releases exactly that tag without raising anything.
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and build, but publish nothing'
        type: boolean
        default: true
      level:
        description: 'Version part to raise when publishing'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: read

# A single release at a time across every trigger. Two runs racing here would
# fight over the tag and the crates.io version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BINARY_NAME: alphawinnow

jobs:
  preflight:
    name: Preflight
    # A rehearsal needs no credentials; every other path ends in an upload, so
    # confirm the token exists before anything is written to the repository.
    if: >-
      github.event_name == 'push'
      || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Confirm the crates.io token is available
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error title=Missing token::CRATES_IO_TOKEN is not set for the crates-io environment"
            exit 1
          fi
          echo "crates.io token is present." >> "$GITHUB_STEP_SUMMARY"

  decide:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      # Whether the release pipeline should run at all.
      proceed: ${{ steps.decide.outputs.proceed }}
      # Whether it should raise the version, or release a version it was given.
      raise: ${{ steps.decide.outputs.raise }}
    steps:
      - name: Checkout the pushed ref
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A manual run can otherwise select an arbitrary branch while retaining
      # the default branch's cache-write scope. Never execute that selected
      # branch: rehearsals and manual releases always start from reviewed code
      # on the repository's default branch.
      - name: Checkout the default branch for a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Classify this run
        id: decide
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          emit() {
            {
              echo "proceed=$1"
              echo "raise=$2"
            } >> "$GITHUB_OUTPUT"
            echo "$3" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${DRY_RUN}" = "false" ]; then
              emit true true "Manual publish requested."
            fi
            emit true false "Rehearsal only; nothing is raised or published."
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            emit true false "Releasing the pushed tag ${GITHUB_REF_NAME}; no version is raised."
          fi

          # Belt and braces. A push made with GITHUB_TOKEN does not start a new
          # workflow run, so the release commit cannot loop back here, but an
          # explicit guard keeps that true if the token is ever swapped out.
          case "${HEAD_MESSAGE}" in
            'chore(release):'*)
              emit false false "Head commit is a release commit; nothing to raise."
              ;;
            *'[skip release]'*)
              emit false false "Head commit asks to skip the release."
              ;;
          esac

          # crates.io versions are immutable, so a documentation-only merge must
          # not burn one. Compare against the previous tip when we have it.
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            changed="$(git show --name-only --format= HEAD)"
          else
            changed="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}")"
          fi
          echo "Changed files:"
          echo "${changed}"

          if grep -qE '^(crates/|Cargo\.toml$|Cargo\.lock$)' <<< "${changed}"; then
            emit true true "Publishable change detected."
          fi
          emit false false "No crate source or manifest change; skipping the release."

  verify:
    name: Verify and tag
    runs-on: ubuntu-latest
    needs:
      - preflight
      - decide
    if: >-
      !cancelled()
      && needs.preflight.result != 'failure'
      && needs.decide.outputs.proceed == 'true'
    permissions:
      # Only the final step writes, and only after every check below passed.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Checkout the pushed ref
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          # The level is derived from the commits since the last `v*` tag.
          fetch-depth: 0

      - name: Checkout the default branch for a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          # workflow_dispatch lets its caller select a ref. Releases may only
          # execute reviewed code from the default branch.
          ref: main
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked --all-features

      - name: Verify the crate is publishable
        run: cargo publish --workspace --dry-run --locked

      # Everything above is read-only. Nothing below runs unless it all passed,
      # so a failing check can never leave a tag behind on a broken commit.
      - name: Raise the version, commit, and tag
        id: raise
        if: needs.decide.outputs.raise == 'true'
        env:
          LEVEL: ${{ inputs.level || 'auto' }}
        run: |
          set -euo pipefail
          version="$(bash scripts/bump-version.sh "${LEVEL}")"

          # The lockfile has to keep matching the manifest, because every job
          # after this one builds the tag with `--locked`.
          cargo metadata --format-version 1 --no-deps --locked > /dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v${version}"
          git tag -a "v${version}" -m "v${version}"
          # A plain push, so a branch that moved under us fails loudly instead
          # of overwriting someone else's commit.
          release_branch="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_branch=main
          fi
          git push origin HEAD:"${release_branch}"
          git push origin "v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Raised to v${version} and tagged." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the release version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RAISED_VERSION: ${{ steps.raise.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version="$(cargo metadata --format-version 1 --no-deps --locked \
            | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "alphawinnow"))')"

          if [ -n "${RAISED_VERSION}" ]; then
            if [ "${RAISED_VERSION}" != "${manifest_version}" ]; then
              echo "::error title=Version mismatch::raised v${RAISED_VERSION} but the manifest says ${manifest_version}"
              exit 1
            fi
            version="${RAISED_VERSION}"
            publish=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "${version}" != "${manifest_version}" ]; then
              echo "::error title=Version mismatch::tag ${GITHUB_REF_NAME} does not match workspace version ${manifest_version}"
              exit 1
            fi
            publish=true
          else
            version="${manifest_version}"
            publish=false
          fi

          # Downstream jobs checkout the exact tree verified above. In
          # particular, never pass a mutable or caller-selected ref across the
          # workflow boundary.
          revision="$(git rev-parse HEAD)"

          {
            echo "version=${version}"
            echo "publish=${publish}"
            echo "revision=${revision}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}; publishing to crates.io: ${publish}" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    name: Binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
          # This job builds and runs the exact commit verified above. It needs
          # no git write access, so do not leave a usable token in the checkout
          # for that code to find.
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Deliberately uncached. These jobs execute build scripts from the
      # verified commit, so writing their results to a cache that another
      # workflow restores would needlessly widen the release trust boundary.
      # Release builds are rare; a cold build is the cheaper side of that
      # trade.
      - name: Build release binary
        run: >
          cargo build --release --locked --all-features
          -p alphawinnow --target ${{ matrix.target }}

      - name: Smoke-test the binary
        # A cross-compiled x86_64 macOS binary still runs on Apple silicon
        # through Rosetta when it is installed; skip it when it is not.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${BINARY_NAME}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            bin="${bin}.exe"
          fi
          "$bin" --version
          "$bin" doctor --json

      - name: Assemble archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          stem="${BINARY_NAME}-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/${stem}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/${BINARY_NAME}.exe" "dist/${stem}/"
          else
            cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "dist/${stem}/"
          fi
          cp README.md LICENSE "dist/${stem}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${stem}.zip" "${stem}" > /dev/null
          else
            tar --create --gzip --file "${stem}.tar.gz" "${stem}"
          fi
          rm -rf "${stem}"
          for archive in "${stem}".*; do
            if command -v sha256sum > /dev/null; then
              sha256sum "${archive}" > "${archive}.sha256"
            else
              shasum -a 256 "${archive}" > "${archive}.sha256"
            fi
          done
          echo "stem=${stem}" >> "$GITHUB_OUTPUT"

      # Native packages for the two Linux targets. Each is produced on its own
      # architecture so that dpkg-shlibdeps and ldd resolve real dependencies,
      # and both reuse the binary the previous steps already built, so the
      # .deb, the .rpm and the tarball ship byte-identical executables.
      - name: Install the Linux packaging tools
        if: contains(matrix.target, 'linux')
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build the .deb and the .rpm
        if: contains(matrix.target, 'linux')
        run: |
          set -euo pipefail
          # --no-strip keeps the packaged executable byte-identical to the one
          # in the tarball. Stripping here would save little and would only be
          # correct alongside a companion debug-symbol package, which this
          # project does not produce.
          cargo deb --no-build --no-strip --target "${{ matrix.target }}" -p alphawinnow --output dist/
          cargo generate-rpm --target "${{ matrix.target }}" -p crates/alphawinnow --output dist/
          cd dist
          for package in *.deb *.rpm; do
            sha256sum "${package}" > "${package}.sha256"
          done
          ls -la

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.stem }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  crates-io:
    name: Publish to crates.io
    needs:
      - verify
      - binaries
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
          # This job builds and runs the exact commit verified above. It needs
          # no git write access, so do not leave a usable token in the checkout
          # for that code to find.
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Uncached for the same reason, and this job additionally holds the
      # crates.io token.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error title=Missing token::CRATES_IO_TOKEN is not set for the crates-io environment"
            exit 1
          fi
          cargo publish --workspace --locked

  github-release:
    name: GitHub Release
    needs:
      - verify
      - binaries
      - crates-io
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
          # This job builds and runs the exact commit verified above. It needs
          # no git write access, so do not leave a usable token in the checkout
          # for that code to find.
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist

          cat > release-notes.md <<'NOTES'
          Prebuilt `alphawinnow` binaries are attached with SHA-256 checksums.
          Every archive is built with `--all-features`, so `numeric-evidence`
          and `parquet-input` are available.

          Install the library or the CLI from crates.io instead:

              cargo install alphawinnow --locked

          Generated candidates are research hypotheses, not trading
          recommendations. See the README for the full scope statement.
          NOTES

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --verify-tag \
            --notes-file release-notes.md \
            dist/*

  packaging:
    name: Update package manifests
    needs:
      - verify
      - binaries
      - github-release
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          # The manifests are committed to the branch, not to the tag: `brew
          # tap` and Scoop both read whatever the default branch holds.
          ref: ${{ github.event.repository.default_branch }}

      - name: Download the release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Regenerate the manifests
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash scripts/update-packaging.sh "${VERSION}" dist

      - name: Commit them if they moved
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula packaging; then
            echo "Manifests already describe v${VERSION}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula packaging
          git commit -m "chore(release): point package manifests at v${VERSION}"

          # The release commit landed on this branch minutes ago and a human
          # merge may have followed it. Rebase once rather than forcing.
          git pull --rebase --autostash origin "${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "Package manifests now point at v${VERSION}." >> "$GITHUB_STEP_SUMMARY"
