[workspace]
members = ["crates/alphawinnow"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/eslazarev/alphawinnow"
homepage = "https://github.com/eslazarev/alphawinnow"

[workspace.dependencies]
anyhow = "1"
arrow-array = "59.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"] }
rayon = "1"
rand = "0.9"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
