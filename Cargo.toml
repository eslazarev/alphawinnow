[workspace]
members = ["crates/alphawinnow"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/eslazarev/alphawinnow"
homepage = "https://github.com/eslazarev/alphawinnow"

[workspace.dependencies]
anyhow = "1"
arrow-array = "60.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
# Parquet 60 supports the zstd 0.14 line containing the October 2026 fixes.
parquet = { version = "60.0", default-features = false, features = ["arrow", "zstd"] }
rayon = "1"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
# Preserve finite f64 bits through JSON checkpoints and external outcomes.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
